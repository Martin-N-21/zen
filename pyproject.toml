[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zen"
version = "0.1.0"
description = "A keyboard-driven local music player for the terminal."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mutagen>=1.47,<2.0",
    "platformdirs>=4.0,<5.0",
    "sqlalchemy>=2.0,<3.0",
    "textual>=0.50,<2.0",
]

[project.scripts]
zen = "zen.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1",
    "pytest>=8.0,<9.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__"]
typeCheckingMode = "basic"
